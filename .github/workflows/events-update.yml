name: events-update
on:
  schedule:
    # Weekly, Mondays 06:47 UTC: refresh events.json from hyrox.com and drop
    # watches for finished races (events-update.js). A few minutes per run.
    - cron: '47 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: events-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # latest watchlist.json, not the one from when this run was queued
      - name: Refresh race list
        env:
          NTFY_ADMIN_TOPIC: ${{ secrets.NTFY_ADMIN_TOPIC }}
        run: node events-update.js
      - name: Save changes
        run: |
          git config user.name "events-update bot"
          git config user.email "actions@github.com"
          git add events.json watchlist.json
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "update race list"
          for i in 1 2 3; do
            git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep $((i * 10))
            git pull --rebase || true
          done
          echo "could not save the race list after 3 tries"
          exit 1
