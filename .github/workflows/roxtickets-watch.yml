name: roxtickets-watch
on:
  schedule:
    # Each run starts the next when it finishes a full loop (chain.js); this
    # schedule is the backup that restarts things if the chain stops.
    # GitHub only fires schedules every few hours lately, so each run keeps
    # checking for 3 hours (LOOP_MINUTES). A trigger that arrives while a run is
    # going waits in the queue and starts as soon as it ends. Odd minutes avoid
    # the busy top-of-the-hour slots.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: 'How long to keep checking (0 = one check, for testing)'
        default: '180'
permissions:
  contents: write
  actions: write    # chain.js starts the next run
concurrency:
  group: roxtickets-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 195
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # latest state.json, not the one from when this run was queued
      - name: Check listings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_ADMIN_TOPIC: ${{ secrets.NTFY_ADMIN_TOPIC }}
          ROX_TOKEN: ${{ secrets.ROX_TOKEN }}
          COMMIT_STATUS: '1'   # status/resale.json and status/alerts-resale.json are committed when they change
          LOOP_MINUTES: ${{ inputs.loop_minutes || '180' }}
          INTERVAL_MINUTES: '5'
        run: node roxtickets-watch.js
      - name: Save state
        if: ${{ !cancelled() }}
        run: |
          git config user.name "roxtickets-watch bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --staged --quiet; then echo "state unchanged"; exit 0; fi
          git commit -m "update state"
          for i in 1 2 3; do
            git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep $((i * 10))
            git pull --rebase || true
          done
          echo "could not save state.json after 3 tries"
          exit 1
      - name: Start the next run
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node chain.js roxtickets-watch.yml
