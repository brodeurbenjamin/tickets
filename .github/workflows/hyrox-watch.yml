name: hyrox-watch
 
on:
  schedule:
    # GitHub only fires schedules every few hours lately, so each run keeps
    # checking every 10 min for 90 min (LOOP_MINUTES). A trigger that arrives
    # while a run is going waits in the queue and starts when it ends. Odd
    # minutes avoid the busy top-of-the-hour slots. Targets: shop-watch.js.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: 'How long to keep checking (0 = one check, for testing)'
        default: '90'
 
concurrency:
  group: hyrox-watch
  cancel-in-progress: false
 
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    container:
      # Browsers are preinstalled here, so no download on every run.
      # Keep this tag in step with the playwright version in package.json.
      image: mcr.microsoft.com/playwright:v1.47.0-jammy
    steps:
      - uses: actions/checkout@v5
 
      - name: Install deps
        run: npm install --no-audit --no-fund
 
      - name: Check official shop
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LOOP_MINUTES: ${{ inputs.loop_minutes || '90' }}
          INTERVAL_MINUTES: '10'
        run: node shop-watch.js
