name: hyrox-watch
 
on:
  schedule:
    # Each run starts the next when it finishes a full loop (chain.js); this
    # schedule is the backup that restarts things if the chain stops.
    # GitHub only fires schedules every few hours lately, so each run keeps
    # checking every 10 min for 3 hours (LOOP_MINUTES). A trigger that arrives
    # while a run is going waits in the queue and starts when it ends. Odd
    # minutes avoid the busy top-of-the-hour slots. Targets: watchlist.json.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: 'How long to keep checking (0 = one check, for testing)'
        default: '180'
 
permissions:
  contents: write   # status/shop.json and status/alerts-shop.json are committed when they change
  actions: write    # chain.js starts the next run
concurrency:
  group: hyrox-watch
  cancel-in-progress: false
 
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 195
    container:
      # Browsers are preinstalled here, so no download on every run.
      # Keep this tag in step with the playwright version in package.json.
      image: mcr.microsoft.com/playwright:v1.47.0-jammy
    steps:
      - uses: actions/checkout@v5
 
      - name: Install deps
        run: npm install --no-audit --no-fund
 
      - name: Allow git in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check official shop
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_ADMIN_TOPIC: ${{ secrets.NTFY_ADMIN_TOPIC }}
          COMMIT_STATUS: '1'
          LOOP_MINUTES: ${{ inputs.loop_minutes || '180' }}
          INTERVAL_MINUTES: '10'
        run: node shop-watch.js

      - name: Start the next run
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node chain.js hyrox-watch.yml
